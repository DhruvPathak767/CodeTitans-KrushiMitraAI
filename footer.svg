<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020c04"/>
      <stop offset="50%" stop-color="#04160a"/>
      <stop offset="100%" stop-color="#020c04"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="80%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .bg-rect { animation: bgPulse 6s ease-in-out infinite; }
    .center-glow { animation: glowBreath 4s ease-in-out infinite; }
    .top-bar { animation: barFadeIn 1.2s ease forwards; }

    @keyframes bgPulse {
      0%,100% { opacity:1; }
      50% { opacity:0.96; }
    }
    @keyframes glowBreath {
      0%,100% { opacity:1; }
      50% { opacity:1.8; }
    }
    @keyframes barFadeIn {
      from { opacity:0; transform:scaleX(0.3); }
      to   { opacity:1; transform:scaleX(1); }
    }
  </style>

  <!-- Background -->
  <rect class="bg-rect" width="900" height="120" fill="url(#bg)"/>

  <!-- Center radial glow -->
  <ellipse class="center-glow" cx="450" cy="60" rx="380" ry="60" fill="url(#centerGlow)"/>

  <!-- Grid lines -->
  <line x1="0" y1="30" x2="900" y2="30" stroke="#22c55e" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="60" x2="900" y2="60" stroke="#22c55e" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="90" x2="900" y2="90" stroke="#22c55e" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect class="top-bar" x="0" y="0" width="900" height="3" fill="url(#topBar)" transform-origin="450 1.5"/>

  <!-- Footer text -->
  <text x="450" y="66"
        font-family="'Arial','Helvetica Neue',sans-serif"
        font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"
        fill="#86efac" letter-spacing="2">BUILT WITH ❤️ FOR INDIA'S FARMERS · TEAM CODETITANS</text>
</svg>
